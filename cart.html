
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart | SpiceHut</title>

  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
</head>

<body>

  <header class="navbar">
    <a href="index.html" class="logo">
      <span class="logo-icon">✦</span>
      Spice<span>Hut</span>
    </a>

    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="cart.html" class="active">
        Cart <span class="cart-count" id="cartCount">0</span>
      </a>
    </nav>

    <button class="menu-toggle" id="menuToggle">☰</button>
  </header>

  <main class="cart-page">

    <div class="cart-heading">
      <span class="section-tag">YOUR ORDER</span>
      <h1>My <span>Shopping Cart</span></h1>
      <p>Delicious food is just one step away.</p>
    </div>

    <div class="cart-layout">

      <section class="cart-items-section">
        <div class="cart-section-title">
          <h2>Your Items</h2>
          <a href="menu.html">+ Add More Items</a>
        </div>

        <div id="cartItems" class="cart-items"></div>
      </section>

      <aside class="cart-summary">
        <h2>Order Summary</h2>

        <div class="summary-row">
          <span>Subtotal</span>
          <strong id="cartSubtotal">₹0</strong>
        </div>

        <div class="summary-row">
          <span>Delivery Fee</span>
          <strong id="deliveryFee">₹0</strong>
        </div>

        <div class="summary-row">
          <span>Taxes</span>
          <strong id="cartTax">₹0</strong>
        </div>

        <div class="summary-divider"></div>

        <div class="summary-row total-row">
          <span>Total Amount</span>
          <strong id="cartTotal">₹0</strong>
        </div>

        <button class="checkout-btn" id="checkoutBtn">
          Proceed to Checkout →
        </button>

        <p class="secure-note">🔒 Secure checkout experience</p>

        <a href="menu.html" class="continue-shopping">
          ← Continue Shopping
        </a>
      </aside>

    </div>
  </main>

  <footer class="footer">
    <div class="footer-bottom">
      <p>© <span id="currentYear"></span> SpiceHut. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
